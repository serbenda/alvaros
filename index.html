<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Álvaro's Gastrobar</title>
    <meta name="description" content="The game of Álvaro's Gastrobar: mini-games with Blanca and the team, chinos and a week behind the bar." />
    <meta name="theme-color" content="#8a5a32" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Álvaro's" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
    <meta property="og:title" content="Álvaro's Gastrobar" />
    <meta property="og:description" content="Serve the regulars before they lose their patience. Can you beat my score?" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="stage">
      <canvas id="game" aria-label="Game"></canvas>

      <section id="screen-title" class="screen title-screen">
        <canvas id="logo" class="logo" width="720" height="240" aria-hidden="true"></canvas>
        <h1 class="visually-hidden" data-i18n="title"></h1>

        <button id="btn-mini" class="hero" type="button">
          <canvas class="hero-icon" data-icon="mini" width="128" height="128" aria-hidden="true"></canvas>
          <span class="hero-text">
            <strong data-i18n="minigames"></strong>
            <small data-i18n="minigamesDesc"></small>
          </span>
          <span class="hero-play" data-i18n="playNow"></span>
          <span class="badge"><span data-i18n="best"></span> <b id="title-mini"></b></span>
        </button>

        <button id="btn-chinos" class="mode mode-chinos mode-wide" type="button">
          <canvas class="mode-icon" data-icon="chinos" width="96" height="96" aria-hidden="true"></canvas>
          <span class="mode-text">
            <strong data-i18n="chinosMode"></strong>
            <small><span data-i18n="chinosWins"></span>: <b id="title-chinos"></b></small>
          </span>
          <span class="mode-arrow" aria-hidden="true">▶</span>
        </button>

        <button id="btn-more" class="more-toggle" type="button" aria-expanded="false" aria-controls="more-modes">
          <span data-i18n="moreModes"></span> <span class="more-caret" aria-hidden="true">▾</span>
        </button>
        <div id="more-modes" class="modes more-modes" hidden>
          <button id="btn-play" class="mode mode-week" type="button">
            <canvas class="mode-icon" data-icon="week" width="96" height="96" aria-hidden="true"></canvas>
            <strong data-i18n="weekShort"></strong>
            <small><b id="title-total"></b></small>
          </button>
          <button id="btn-rush" class="mode mode-rush" type="button">
            <canvas class="mode-icon" data-icon="rush" width="96" height="96" aria-hidden="true"></canvas>
            <strong data-i18n="rush"></strong>
            <small><b id="title-best"></b></small>
          </button>
          <button id="btn-daily" class="mode mode-daily" type="button">
            <canvas class="mode-icon" data-icon="daily" width="96" height="96" aria-hidden="true"></canvas>
            <strong data-i18n="dailyShort"></strong>
            <small id="daily-twist"></small>
          </button>
        </div>

        <div class="team">
          <p class="team-title" data-i18n="teamTitle"></p>
          <div id="team-list" class="team-list"></div>
          <p id="team-desc" class="team-desc"></p>
        </div>

        <nav class="toolbar">
          <button id="btn-album" class="tool" type="button"><span class="tool-icon">📖</span><span data-i18n="albumShort"></span></button>
          <button id="btn-howto" class="tool" type="button"><span class="tool-icon">❓</span><span data-i18n="howToShort"></span></button>
          <button id="btn-lang" class="tool" type="button"></button>
          <button id="btn-sound" class="tool" type="button"></button>
          <button id="btn-fullscreen" class="tool" type="button"></button>
        </nav>

        <!-- A real link, so phones open GitHub Sponsors on the tap itself (popups opened later are blocked) -->
        <a id="btn-coffee" class="coffee" href="https://github.com/sponsors/serbenda" target="_blank" rel="noopener">
          <canvas id="coffee-cup" width="96" height="96" aria-hidden="true"></canvas>
          <span class="coffee-text">
            <strong data-i18n="coffeeTitle"></strong>
            <span id="coffee-sub"></span>
          </span>
        </a>
      </section>

      <section id="screen-week" class="screen hidden">
        <h2 data-i18n="week"></h2>
        <p class="subtitle" data-i18n="chooseDay"></p>
        <div id="week-list" class="week"></div>
        <button class="btn" type="button" data-back data-i18n="back"></button>
      </section>

      <section id="screen-howto" class="screen hidden howto-screen">
        <h2 data-i18n="howTo"></h2>
        <div class="howto-hello">
          <canvas id="howto-blanca" width="96" height="96" aria-hidden="true"></canvas>
          <p class="howto-bubble" data-i18n="howToHello"></p>
        </div>
        <div id="howto-list" class="howto-cards"></div>
        <details class="howto-more">
          <summary data-i18n="howToBarTitle"></summary>
          <ol id="howto-bar" class="howto"></ol>
          <p class="hint" data-i18n="keyboardHint"></p>
        </details>
        <p class="howto-tip" data-i18n="howToTip"></p>
        <button class="btn primary" type="button" data-back data-i18n="gotIt"></button>
      </section>

      <section id="screen-album" class="screen hidden">
        <h2 data-i18n="album"></h2>
        <p class="album-section" data-i18n="stickersTitle"></p>
        <p id="sticker-count" class="subtitle"></p>
        <div id="sticker-grid" class="stickers"></div>
        <p class="album-section" data-i18n="regularsTitle"></p>
        <p id="album-count" class="subtitle"></p>
        <div id="album-grid" class="album"></div>
        <button class="btn" type="button" data-back data-i18n="back"></button>
      </section>

      <section id="screen-pause" class="screen hidden">
        <h2 data-i18n="paused"></h2>
        <div class="buttons">
          <button id="btn-resume" class="btn primary" type="button" data-i18n="resume"></button>
          <button id="btn-quit" class="btn" type="button" data-i18n="quit"></button>
        </div>
      </section>

      <section id="screen-over" class="screen hidden">
        <h2 id="over-title"></h2>
        <p id="over-mode" class="subtitle"></p>
        <p id="over-stars" class="big-stars hidden"></p>
        <p id="over-score" class="big-score"></p>
        <p id="over-hint" class="subtitle hidden"></p>
        <p id="over-record" class="record hidden" data-i18n="newRecord"></p>
        <p id="over-line" class="over-line"></p>
        <p id="over-stickers" class="over-stickers hidden"></p>
        <div id="over-prize" class="prize hidden">
          <span class="prize-label" data-i18n="prizeLabel"></span>
          <strong id="prize-code" class="prize-code"></strong>
          <span class="prize-hint" data-i18n="prizeHint"></span>
        </div>
        <dl class="stats">
          <dt id="over-served-label" data-i18n="served"></dt><dd id="over-served"></dd>
          <dt id="over-combo-label" data-i18n="bestCombo"></dt><dd id="over-combo"></dd>
          <dt id="over-best-label"></dt><dd id="over-best"></dd>
          <div id="over-total-row" class="row-contents"><dt data-i18n="totalTips"></dt><dd id="over-total"></dd></div>
        </dl>
        <div class="buttons">
          <button id="btn-next" class="btn primary hidden" type="button" data-i18n="nextDay"></button>
          <button id="btn-retry" class="btn primary" type="button" data-i18n="retry"></button>
          <div class="row">
            <button id="btn-share" class="btn" type="button" data-i18n="share"></button>
            <button id="btn-menu" class="btn" type="button" data-i18n="menu"></button>
          </div>
        </div>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="src/main.js"></script>
    <!-- Visit counter (GoatCounter), the same as the other games on bendi.dev -->
    <script>window.goatcounter = { path: '/alvaros/' };</script>
    <script data-goatcounter="https://serbenda.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
