<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Álvaro's Gastrobar — Poster</title>
  <meta name="robots" content="noindex" />
  <!-- Printable A4 poster with a QR code to the game, to put up in the bar. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #e8dcc6; }
    body {
      font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      color: #3b2416;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet {
      width: 210mm;
      height: 297mm;
      margin: 12px auto;
      padding: 14mm 14mm 12mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6mm;
      background: #fff6e4;
      border: 6mm solid #e2a93b;
      outline: 1.5mm solid #8c5a8f;
      outline-offset: -9mm;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    canvas { image-rendering: pixelated; }
    #logo { width: 150mm; height: 50mm; }
    h1 {
      margin: 0;
      font-size: 17mm;
      line-height: 1;
      text-align: center;
      color: #8c3b2a;
      letter-spacing: -0.5mm;
    }
    .sub { margin: -2mm 0 0; font-size: 6mm; text-align: center; }
    .sub em { color: #8c5a8f; font-style: normal; font-weight: bold; }
    .team { display: flex; gap: 3mm; justify-content: center; }
    .member { display: flex; flex-direction: column; align-items: center; font-size: 4mm; font-weight: bold; }
    .member canvas { width: 26mm; height: 26mm; background: #f3dfb8; border-radius: 50%; border: 0.8mm solid #3b2416; }
    .scan { display: flex; align-items: center; gap: 8mm; }
    #qr { width: 78mm; height: 78mm; padding: 3mm; background: #fff; border: 1.2mm solid #3b2416; border-radius: 3mm; }
    .steps { margin: 0; padding: 0; list-style: none; font-size: 6.2mm; line-height: 1.5; }
    .steps b { color: #8c3b2a; }
    .url { font-size: 5mm; font-weight: bold; color: #8c5a8f; }
    .record {
      width: 100%;
      margin-top: auto;
      padding: 4mm 6mm;
      font-size: 7mm;
      font-weight: bold;
      text-align: center;
      background: #3b2416;
      color: #fff6e4;
      border-radius: 3mm;
    }
    .record span { display: inline-block; min-width: 70mm; border-bottom: 0.6mm dashed #e2a93b; }
    .en { font-size: 4mm; text-align: center; opacity: 0.75; margin: 0; }
    .print {
      position: fixed;
      right: 16px;
      bottom: 16px;
      padding: 12px 18px;
      font: bold 16px system-ui, sans-serif;
      color: #fff;
      background: #8c3b2a;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    @media print {
      html, body { background: #fff6e4; }
      .sheet { margin: 0; box-shadow: none; }
      .print { display: none; }
    }
    @media screen and (max-width: 820px) {
      .sheet { zoom: 0.45; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <canvas id="logo" width="720" height="240"></canvas>
    <h1>¿Le ganas a Blanca?</h1>
    <p class="sub">Minijuegos, <em>chinos</em> y una semana detrás de la barra</p>
    <div class="team" id="team"></div>
    <div class="scan">
      <canvas id="qr" width="400" height="400"></canvas>
      <ol class="steps">
        <li><b>1.</b> Escanea con el móvil</li>
        <li><b>2.</b> Juega gratis, sin instalar</li>
        <li><b>3.</b> Enséñanos tu récord 🏆</li>
        <li class="url" id="url"></li>
      </ol>
    </div>
    <p class="en">Can you beat Blanca? Scan, play for free and show us your best score.</p>
    <div class="record">Récord de la semana: <span>&nbsp;</span></div>
  </main>
  <button class="print" type="button" onclick="window.print()">Imprimir</button>

  <script type="module">
    import { drawLogo } from './src/ui/logo.js';
    import { drawPerson } from './src/graphics/sprites.js';
    import { PLAYER, HELPERS, BOSS } from './src/config.js';

    const GAME_URL = 'https://bendi.dev/alvaros/';
    document.getElementById('url').textContent = GAME_URL.replace('https://', '');

    drawLogo(document.getElementById('logo').getContext('2d'), 0, 4);

    const team = [PLAYER, ...Object.values(HELPERS), BOSS];
    const list = document.getElementById('team');
    for (const member of team) {
      const box = document.createElement('div');
      box.className = 'member';
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');
      ctx.setTransform(4, 0, 0, 4, 0, 0);
      drawPerson(ctx, member.look, 16, 6 + (member.look.offset || 0), { mood: 'happy' });
      box.append(c, member.name);
      list.appendChild(box);
    }

    const canvas = document.getElementById('qr');
    if (window.qrcode) {
      const qr = window.qrcode(0, 'M');
      qr.addData(GAME_URL);
      qr.make();
      const n = qr.getModuleCount();
      const ctx = canvas.getContext('2d');
      const cell = Math.floor(canvas.width / n);
      const pad = Math.floor((canvas.width - cell * n) / 2);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000';
      for (let r = 0; r < n; r++) {
        for (let col = 0; col < n; col++) if (qr.isDark(r, col)) ctx.fillRect(pad + col * cell, pad + r * cell, cell, cell);
      }
    } else {
      canvas.remove(); // Without the QR library the address below is still on the poster.
    }
  </script>
</body>
</html>
